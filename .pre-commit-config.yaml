repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0  # Use the latest available version
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: no-cyrillic
        name: english only (no Cyrillic)
        description: >
          This repo is English-only - docs, comments and log messages must
          not contain Cyrillic. See README.md.
        entry: python3 scripts/check_english_only.py
        language: system
        types: [text]

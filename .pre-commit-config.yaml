repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0  # Use the latest available version
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: no-cyrillic
        name: english only (no Cyrillic)
        description: >
          This repo is English-only - docs, comments and log messages must
          not contain Cyrillic. See README.md.
        # chr(0x0400)/chr(0x04FF) build the Cyrillic-block boundaries at
        # runtime rather than as \u-escapes or literal characters, so this
        # entry does not trip its own check and isn't at the mercy of
        # editors/YAML parsers normalizing escapes.
        entry: |
          python3 -c "
          import re, sys
          lo, hi = chr(0x0400), chr(0x04FF)
          pat = re.compile('[' + lo + '-' + hi + ']')
          bad = False
          for path in sys.argv[1:]:
              try:
                  text = open(path, encoding='utf-8').read()
              except (UnicodeDecodeError, OSError):
                  continue
              for i, line in enumerate(text.splitlines(), 1):
                  if pat.search(line):
                      print(f'{path}:{i}: {line}')
                      bad = True
          if bad:
              print('Cyrillic text found above - this repo is English-only, see README.md.')
          sys.exit(1 if bad else 0)
          "
        language: system
        types: [text]

# ultralytics augmentation hyperparameters, all disabled - a clean baseline
# to measure against, not a training recipe. Turning these off measurably
# hurt: night mAP 0.2516 -> 0.2153 and the night/day gap 7.71% -> 11.04%
# (log lines #2 and #8). Use `augment=default` for the notebook's
# recipe, or override single keys: `python3 train.py augment.hsv_v=0.4`.
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
degrees: 0.0
translate: 0.0
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
bgr: 0.0
mosaic: 0.0
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
auto_augment: null
erasing: 0.0

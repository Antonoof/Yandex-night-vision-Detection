# Deterministic preprocessing shared by train, val and inference.
zero_dce:
  enabled: true
  weights_path: weights/zero_dce_Epoch99.pth
  apply_to: [night]
  splits: [train, val]
  # same_as_trainer maps trainer.device=0 to cuda:0. CPU is also supported.
  device: same_as_trainer
  use_amp: true
  batch_size: 8

cache:
  # Enhanced JPEGs are content-addressed by weights + AMP + JPEG settings.
  # Keep this outside datasets.work_dir because work_dir is rebuilt each run.
  dir: data/preprocessed_cache
  overwrite: false
  jpeg_quality: 95
